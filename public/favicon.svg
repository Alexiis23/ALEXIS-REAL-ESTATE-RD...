  <line x1="17" y1="38" x2="35" y2="38" stroke="#C9A84C" stroke-width="0.7" opacity="0.6"/>
  <line x1="17" y1="46" x2="35" y2="46" stroke="#C9A84C" stroke-width="0.7" opacity="0.6"/>
